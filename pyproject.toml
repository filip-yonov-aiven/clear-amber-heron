[project]
name = "clear-amber-heron"
version = "0.1.0"
description = "A FastAPI app with PostgreSQL, scaffolded by Cook."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pydantic-settings>=2.15.0",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "service"
module-root = ""
